
name: Actualiser CH LIVE

on:
  workflow_dispatch:

  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: ch-live-data
  cancel-in-progress: false

jobs:
  update:
    name: Actualisation des données LNH
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le dépôt GitHub
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Vérifier Python
        run: |
          python --version

      - name: Télécharger les données LNH
        run: |
          python scripts/update_data.py

      - name: Vérifier les fichiers JSON
        run: |
          echo "Fichiers présents dans data :"
          ls -lah data/

      - name: Publier les données actualisées
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/

          if git diff --cached --quiet; then
            echo "Aucune modification détectée."
            exit 0
          fi

          git commit -m "Mise à jour automatique des données LNH"

          for tentative in 1 2 3 4 5; do
            echo "Tentative de publication : ${tentative}/5"

            # Intégrer les nouveaux commits du dépôt
            if ! git pull --rebase origin main; then
              echo "::error::Conflit Git pendant le rebase."
              git rebase --abort || true
              exit 1
            fi

            # Publier les données actualisées
            if git push origin HEAD:main; then
              echo "Données LNH publiées avec succès."
              exit 0
            fi

            echo "Le dépôt a changé pendant la publication."
            echo "Nouvelle tentative dans 5 secondes..."
            sleep 5
          done

          echo "::error::Publication impossible après 5 tentatives."
          exit 1
